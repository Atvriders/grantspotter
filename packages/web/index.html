<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Three forms of one mark, from packages/web/public (Vite copies that directory to the root of
      the bundle, and the server serves the bundle, so these are the URLs in production too).

      The .ico is listed FIRST and is not redundant. Browsers request /favicon.ico on their own
      whether or not it is linked, and linking it also names it explicitly for the browsers that
      ignore SVG icons rather than leaving them to guess.

      Every href is root-absolute. A relative one resolves against the current URL, and this same
      shell is served for /browse and /o/<slug>, where "favicon.svg" would mean "/o/favicon.svg".

      THE apple-touch-icon LINK IS LOAD-BEARING IN ONE DIRECTION ONLY, and it is worth knowing which.
      With it present, iOS asks for this exact path and nothing else. Remove it and iOS starts
      guessing a sequence of root filenames instead — apple-touch-icon-152x152-precomposed.png and
      three more. That used to mean four requests landing on the SPA's history fallback, which
      answers HTML with a 200: a missing image reported as a success, with nothing anywhere logging
      a 404. It no longer can. `packages/server/src/api/spa.ts` refuses to answer the shell for a
      root-level path that names an image file, so a guess that finds nothing gets a 404, and this
      link is a nicety again rather than the only thing standing between a browser and a lie.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>GrantSpotter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
