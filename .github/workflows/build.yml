name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # A freshly created repository sometimes will not run its first push-triggered
  # workflow. Manual dispatch is the escape hatch; see the README deploy notes.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The whole suite, never narrowed. `vitest run --project server` once dropped 653
      # web tests and stayed green; a flag added here would do the same with nothing
      # watching. The tracked defects that print as "todo" are deliberate: vitest does
      # not count them as passing and this step does not hide them.
      #
      # The Playwright browser suite is deliberately absent. It needs downloaded
      # browsers, a running server and a bootstrapped account, so it is run against a
      # real stack in the closing tasks of the ship plan instead. The live source
      # checker is absent for the same class of reason: it hits ~25 volunteer-run
      # sites, and the network is not a build dependency (spec §14).
      - name: Unit and integration tests
        run: npm test

  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under QEMU emulation on an amd64 runner. That is the slow part,
      # which is what the gha layer cache below is for.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/atvriders/grantspotter:latest
            ghcr.io/atvriders/grantspotter:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Atvriders/grantspotter
            org.opencontainers.image.description=GrantSpotter — a self-hosted funding desk for collegiate and educational amateur radio
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
