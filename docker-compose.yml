# GrantSpotter. Pulls the image published by GitHub Actions; it does not build.
#
# There is no .env file and nothing to copy. Edit the ONE value marked EDIT THIS below, then:
#
#   docker compose pull
#   docker compose up -d
#
# That value ships as a placeholder, and the server refuses to start while any recognisable piece
# of it is still in place — see packages/server/src/config.ts. Deleting the CHANGE_ME_ prefix is
# not an edit; the rest of the line is published here too, and the check is on any eight-character
# run, not on the marker. That refusal replaces the ":?" interpolation guard this file used to
# carry, and it exists because this repository is public: a session secret readable on GitHub is
# one every unedited deployment shares, so the cookie signature stops proving this server issued
# anything.
#
# THIS FILE IS TRACKED BY GIT. If your copy of this repository is a fork you push, the secret you
# paste below is published the moment you push it — the same accident, from the other direction.
# Deploy from a download or from a clone you never push and it cannot happen. If you do push,
# change the SESSION_SECRET line to interpolate from the environment, written exactly the way the
# HOST_PORT line further down is written, and keep the value in a `.env` beside this file: compose
# reads that file and `.gitignore` already ignores it. That is the two-file arrangement this
# layout exists to avoid, so it is the answer for a tracked fork, not the default.
#
# Upgrading from the version of this file that read a .env? These are literal values now, and
# a literal here beats anything in a .env — an old SESSION_SECRET left in that file is ignored,
# and the server refuses to start until it is pasted in below. HOST_PORT is the exception: it
# is still interpolated, so `HOST_PORT=8080 docker compose up -d` and a .env both still work
# for it. It stays a variable because it has a safe default, because getting it wrong costs a
# URL rather than a security property, and because a host that has to move off 3030 should not
# have to edit a tracked file to do it.

services:
  grantspotter:
    image: ghcr.io/atvriders/grantspotter:latest
    container_name: grantspotter
    restart: unless-stopped
    init: true
    ports:
      # host:container. Change the left-hand number if 3030 is already claimed on this host;
      # the container always listens on 3030.
      - "${HOST_PORT:-3030}:3030"
    environment:
      PORT: 3030
      DATA_DIR: /data

      # EDIT THIS — the only value in this file you must change. Required, no default, and the
      # placeholder below is refused by value.
      # Generate a real one with:  openssl rand -hex 32
      SESSION_SECRET: CHANGE_ME_generate_one_with_openssl_rand_hex_32_and_paste_it_here

      # Works as shipped. This goes into the crawler's User-Agent and is how a site owner finds
      # out who is polling them; left at the value below it points them at this project's issue
      # tracker, which reaches a human.
      #
      # OVERRIDE IT if complaints should reach YOU rather than this project's maintainers — you
      # are running a modified fork, a large or long-running deployment, or polling on behalf of
      # an institution. Every deployment that keeps this default names the SAME tracker, so a
      # site owner who wants your instance in particular to stop reaches people who do not run it
      # and cannot stop it. Replace it with an http(s) page you control and can be reached
      # through. The reserved documentation domains (example.com/.net/.org, .invalid, .test,
      # .example) are refused: they resolve for nobody, which is anonymity wearing a name tag.
      CONTACT_URL: https://github.com/Atvriders/grantspotter/issues

      CRAWL_ENABLED: "true"
      CRAWL_CRON: "17 3 * * *"

      # Optional. Everything works with these empty: the deterministic parsers, the rule-based
      # scoring and the copy-prompt flow need no key. Paste one in to use it.
      ANTHROPIC_API_KEY: ""
      SIMPLER_GRANTS_API_KEY: ""
    volumes:
      # The SQLite database, the snapshots and the fixture cache. Without this the
      # corpus is rebuilt from seed on every recreate and every local edit is lost.
      - grantspotter-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect({host:'127.0.0.1',port:3030},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(4000,()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  grantspotter-data:
