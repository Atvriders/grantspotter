# GrantSpotter. Pulls the image published by GitHub Actions; it does not build.
#
# There is no .env file and nothing to copy. Edit the two values marked EDIT THIS below,
# then:
#
#   docker compose pull
#   docker compose up -d
#
# Both of those ship as placeholders containing CHANGE_ME, and the server refuses to start
# while either is still in place — see packages/server/src/config.ts. That refusal replaces
# the ":?" interpolation guard this file used to carry, and it exists because this repository
# is public: a session secret published on GitHub is one anyone can forge cookies with, and a
# crawler with a placeholder contact URL is one the ~25 small nonprofits it polls can neither
# identify nor ask to stop.
#
# Upgrading from the version of this file that read a .env? These are literal values now, and
# a literal here beats anything in a .env — an old SESSION_SECRET left in that file is ignored,
# and the server refuses to start until it is pasted in below. HOST_PORT is the exception: it
# is still interpolated, so `HOST_PORT=8080 docker compose up -d` and a .env both still work
# for it. It stays a variable because it has a safe default, because getting it wrong costs a
# URL rather than a security property, and because a host that has to move off 3030 should not
# have to edit a tracked file to do it.

services:
  grantspotter:
    image: ghcr.io/atvriders/grantspotter:latest
    container_name: grantspotter
    restart: unless-stopped
    init: true
    ports:
      # host:container. Change the left-hand number if 3030 is already claimed on this host;
      # the container always listens on 3030.
      - "${HOST_PORT:-3030}:3030"
    environment:
      PORT: 3030
      DATA_DIR: /data

      # EDIT THIS — required, no default, and the placeholder below is refused by value.
      # Generate a real one with:  openssl rand -hex 32
      SESSION_SECRET: CHANGE_ME_generate_one_with_openssl_rand_hex_32_and_paste_it_here

      # EDIT THIS — required, no default, and the placeholder below is refused by value.
      # An http(s) page you control. It goes into the crawler's User-Agent so a site owner
      # can find out who is polling them, for example https://www.example.org/grantspotter
      CONTACT_URL: https://example.org/CHANGE_ME_to_a_page_that_says_who_runs_this

      CRAWL_ENABLED: "true"
      CRAWL_CRON: "17 3 * * *"

      # Optional. Everything works with these empty: the deterministic parsers, the rule-based
      # scoring and the copy-prompt flow need no key. Paste one in to use it.
      ANTHROPIC_API_KEY: ""
      SIMPLER_GRANTS_API_KEY: ""
    volumes:
      # The SQLite database, the snapshots and the fixture cache. Without this the
      # corpus is rebuilt from seed on every recreate and every local edit is lost.
      - grantspotter-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect({host:'127.0.0.1',port:3030},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(4000,()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  grantspotter-data:
