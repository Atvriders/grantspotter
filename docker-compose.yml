# GrantSpotter. Pulls the image published by GitHub Actions; it does not build.
#
# There is no .env file and nothing to copy. Edit the TWO values marked EDIT THIS below — the
# session secret and the contact URL — then:
#
#   docker compose pull
#   docker compose up -d
#
# BOTH ship as placeholders and the server refuses to start on either of them. Neither has a
# default, and neither can have one: a shared secret is not a secret, and a shared contact address
# would name somebody who cannot switch YOUR instance off. See packages/server/src/config.ts.
#
# For SESSION_SECRET, deleting the CHANGE_ME_ prefix is not an edit: the rest of the line is
# published here too, and the check is on any eight-character run of it, not on the marker. That
# refusal replaces the ":?" interpolation guard this file used to carry, and it exists because this
# repository is public — a session secret readable on GitHub is one every unedited deployment
# shares, so the cookie signature stops proving this server issued anything.
#
# For CONTACT_URL the run check would be wrong ("https://" is an eight-character run of the
# placeholder, so it would refuse every https URL), and two rules catch it instead: the CHANGE_ME
# marker, and example.org being reserved by RFC 2606 for documentation. Change one half and the
# other still refuses it.
#
# THIS FILE IS TRACKED BY GIT. If your copy of this repository is a fork you push, the secret you
# paste below is published the moment you push it — the same accident, from the other direction.
# Deploy from a download or from a clone you never push and it cannot happen. If you do push,
# change the SESSION_SECRET line to interpolate from the environment, written exactly the way the
# HOST_PORT line further down is written, and keep the value in a `.env` beside this file: compose
# reads that file and `.gitignore` already ignores it. That is the two-file arrangement this
# layout exists to avoid, so it is the answer for a tracked fork, not the default.
#
# Upgrading from the version of this file that read a .env? These are literal values now, and
# a literal here beats anything in a .env — an old SESSION_SECRET left in that file is ignored,
# and the server refuses to start until it is pasted in below. HOST_PORT is the exception: it
# is still interpolated, so `HOST_PORT=8080 docker compose up -d` and a .env both still work
# for it. It stays a variable because it has a safe default, because getting it wrong costs a
# URL rather than a security property, and because a host that has to move off 3030 should not
# have to edit a tracked file to do it.

services:
  grantspotter:
    image: ghcr.io/atvriders/grantspotter:latest
    container_name: grantspotter
    restart: unless-stopped
    init: true
    ports:
      # host:container. Change the left-hand number if 3030 is already claimed on this host;
      # the container always listens on 3030.
      - "${HOST_PORT:-3030}:3030"
    environment:
      PORT: 3030
      DATA_DIR: /data

      # EDIT THIS (1 of 2) — required, no default, and the placeholder below is refused by value.
      # Generate a real one with:  openssl rand -hex 32
      SESSION_SECRET: CHANGE_ME_generate_one_with_openssl_rand_hex_32_and_paste_it_here

      # EDIT THIS (2 of 2) — required, no default, and the placeholder below is refused by value.
      #
      # This goes into the crawler's User-Agent and is the only route by which one of the ~25
      # small, volunteer-run sites this polls can find out who is polling them and ask you to
      # stop. It must be YOURS. This project once shipped its own issue tracker here as a working
      # default, and the reason that was removed is the reason it is required now: a shared
      # address makes the maintainers of the SOFTWARE the contact for every deployment of it,
      # including the ones they do not run, cannot inspect and cannot stop. The site owner who
      # wrote in would get an apology instead of a result.
      #
      # Replace it with an http(s) page you control and can be reached through — a club page, a
      # department page, a personal site. It does not have to be this instance, and it does not
      # have to be elaborate; it has to say who runs this and how to reach you. Refused: the
      # reserved documentation names (example.com/.net/.org, .invalid, .test, .example), anything
      # a stranger cannot reach (localhost, 127.x, 10.x, 172.16-31.x, 192.168.x, .local,
      # .internal, .home.arpa, a single-label name), and anything still carrying CHANGE_ME.
      #
      # If you cannot supply one, the remedy a polled site has does not depend on you: every
      # instance obeys "User-agent: GrantSpotter / Disallow: /", from the next nightly crawl.
      CONTACT_URL: https://example.org/CHANGE_ME_to_a_page_that_says_who_runs_this

      CRAWL_ENABLED: "true"
      CRAWL_CRON: "17 3 * * *"

      # Optional. Everything works with these empty: the deterministic parsers, the rule-based
      # scoring and the copy-prompt flow need no key. Paste one in to use it.
      ANTHROPIC_API_KEY: ""
      SIMPLER_GRANTS_API_KEY: ""
    volumes:
      # The SQLite database, the snapshots and the fixture cache. Without this the
      # corpus is rebuilt from seed on every recreate and every local edit is lost.
      - grantspotter-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect({host:'127.0.0.1',port:3030},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(4000,()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  grantspotter-data:
